# Publish Hex Dominion to GitHub Pages.
#
# There is nothing to build: the game is zero-dependency ES modules and static
# assets served straight from the repo. The "build" is a test run, a real-browser
# smoke test, and an upload.
#
# Both gates must pass before a deploy — a broken push should never become the
# playable link.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a queued deploy finish rather than cancelling it, but never run two at
# once against the same environment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No `npm ci`: the project has no dependencies.
      - name: Unit tests (world, battle, meta, fx, camera, input)
        run: npm test

  # A synthetic el.click() bypasses hit testing, so only real pointer events in a
  # real browser prove the game is clickable. tools/check.mjs boots the game in
  # headless Chrome (via tools/cdp.js, no dependencies), clicks through New Realm,
  # starts a battle, drag-sends troops, wins, and reloads to check the save — at
  # desktop size and at phone size with touch — and once more under the /temp/ prefix.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate Chrome
        run: |
          BIN="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$BIN" ]; then echo "no Chrome on this runner"; exit 1; fi
          echo "CHROME_PATH=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version
      - name: Serve the game
        run: |
          # nohup + redirected output: a bare background job can die with the step.
          nohup npm start > /tmp/serve.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://localhost:8080/; then
            echo "dev server never came up:"; cat /tmp/serve.log; exit 1
          fi
      - name: Smoke test in a real browser
        run: node tools/check.mjs
      # The site is served from a PROJECT SUBPATH (https://ka1e27.github.io/temp/), never from "/". This runs the
      # same suite against a server that serves the repo under /temp/ with nothing at "/" (like Pages), then checks
      # the deployed shape: every asset resolves under the prefix, the service worker's scope and cache, the
      # manifest's start_url and icons, classic.html, and an offline reload after one visit.
      - name: Smoke test under the /temp/ subpath (service worker, manifest, offline)
        run: node tools/check.mjs --base=temp

  deploy:
    needs: [verify, browser]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # One-time setup by a repo admin: Settings -> Pages -> Source: "GitHub Actions".
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          # Served from a subpath (/temp/); every asset reference is relative.
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
