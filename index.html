<link rel="stylesheet" href="./game/styles/main.css">
<link rel="stylesheet" href="./game/app/app.css">
<style>
  /* Boot splash: visible until game/main.js removes it, so a slow connection
     shows a title card instead of a black page. Kept inline on purpose. */
  html, body { margin: 0; height: 100%; background: #101826; overflow: hidden; }
  /* The world canvas: full-bleed background every scene draws on. Sized in
     JS (game/render/renderer.js's resize()) to the CSS box this establishes;
     kept inline for the same reason #boot is (visible before main.css loads). */
  #world { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 50;
    background: radial-gradient(ellipse at 50% 40%, #1f3b57 0%, #101826 70%);
    color: #f3ead7; font-family: Cinzel, Georgia, serif; transition: opacity .6s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot h1 { margin: 0; font-size: clamp(34px, 7vw, 72px); letter-spacing: .08em;
    color: #f5c451; text-shadow: 0 2px 0 #6b4a0e, 0 8px 30px rgba(0,0,0,.5); }
  #boot p { margin: 14px 0 0; font: 600 14px/1.4 Nunito, system-ui, sans-serif;
    color: #a3a9b6; letter-spacing: .12em; text-transform: uppercase; text-align: center; }
  #boot .bar { width: 160px; height: 3px; margin: 22px auto 0; border-radius: 3px;
    background: rgba(255,255,255,.1); overflow: hidden; }
  #boot .bar i { display: block; width: 40%; height: 100%; background: #f5c451;
    animation: boot-slide 1.1s ease-in-out infinite; }
  @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
</style>
<script>
// The service worker is handed every file this page loaded (performance resource entries, see the bottom of the page),
// but the browser keeps only 250 entries by default and the game is more modules than that: without a bigger buffer the
// late ones were never cached, and an offline reload after a first visit failed. Raised before main.js starts loading.
if (performance.setResourceTimingBufferSize) performance.setResourceTimingBufferSize(2000);
// Classic (non-module) script so it still runs when module loading is blocked:
// ES modules cannot load from file://, and the page would otherwise stay blank.
if (location.protocol === 'file:') {
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('boot').innerHTML =
      '<div style="max-width:34rem;padding:2rem;font:16px/1.6 system-ui,sans-serif">' +
      '<h1 style="font-size:32px">Run a local server</h1>' +
      '<p style="text-transform:none;letter-spacing:0;color:#f3ead7">ES modules cannot load from ' +
      '<code>file://</code>. Run <code>npm start</code> and open ' +
      '<a style="color:#9cc0ff" href="http://localhost:8080">http://localhost:8080</a>.</p></div>';
  });
}
</script>
</head>
<body>
  <canvas id="world" aria-label="Hex Dominion world map"></canvas>
  <div id="ui"></div>
  <div id="boot" role="status">
    <div>
      <h1>HEX DOMINION</h1>
      <p>Charting the continent…</p>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <noscript><p style="position:fixed;inset:auto 0 20px;text-align:center;color:#f3ead7;font:16px system-ui">Hex Dominion needs JavaScript.</p></noscript>
  <script type="module" src="./game/main.js"></script>
  <script>
    // Offline play and installability. HTTPS only (i.e. GitHub Pages, not the dev server), registered
    // after load so it never competes with first paint. tools/check.mjs opts in on localhost with ?sw=1
    // so the deployed code path is what gets tested.
    if ('serviceWorker' in navigator && (location.protocol === 'https:' ||
        (location.hostname === 'localhost' && /[?&]sw=1(&|$)/.test(location.search)))) {
      addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function () {
          return navigator.serviceWorker.ready;
        }).then(function (reg) {
          // A worker never controls the page that registered it, so nothing this first load fetched went
          // through its cache. Hand it the list of everything the page used: the next reload works offline.
          var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
          urls.push(location.href);
          if (reg.active) reg.active.postMessage({ type: 'precache', urls: urls });
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
