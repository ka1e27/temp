<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hex Dominion — idle conquest, real-time battles</title>
<!-- THE SHELL. None of this is visible inside the game, which is exactly why it
     was missing: a browser game with a default tab icon and no share preview
     reads as a prototype before a single pixel of it has loaded.

     `maximum-scale=1,user-scalable=no` used to be here to stop double-tap zoom
     during a drag. It also forbids pinch-zoom, which is WCAG 1.4.4 (Resize
     Text) — and it was never the right tool: `touch-action` in the CSS already
     suppresses the browser's own gestures on the two boards, per element, which
     is the fix that does not take zoom away from everyone else. -->
<meta name="description" content="Take a hex world one region at a time. Conquered
 regions pay you crowns whether or not you are playing; crowns buy the upgrades that
 crack the next, harder region. Real-time battles, deterministic combat, no downloads.">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="Hex Dominion">
<meta property="og:site_name" content="Hex Dominion">
<meta property="og:description" content="Idle conquest with real-time battles. Twenty-four
 regions, an endless incursion ladder, and combat with no dice in it.">
<meta property="og:image" content="https://ka1e27.github.io/temp/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://ka1e27.github.io/temp/">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="./src/styles/tokens.css">
<link rel="stylesheet" href="./src/styles/base.css">
<link rel="stylesheet" href="./src/styles/hud.css">
<link rel="stylesheet" href="./src/styles/hudpreview.css">
<link rel="stylesheet" href="./src/styles/hud.responsive.css">
<link rel="stylesheet" href="./src/styles/screens.css">
<link rel="stylesheet" href="./src/styles/sitepanel.css">
<link rel="stylesheet" href="./src/styles/panelbars.css">
<link rel="stylesheet" href="./src/styles/prebattle.css">
<link rel="stylesheet" href="./src/styles/scenes.css">
<link rel="stylesheet" href="./src/styles/results.css">
<link rel="stylesheet" href="./src/styles/worldmap.css">
<script>
// Classic (non-module) script so it still runs when module loading is blocked.
// ES modules are always fetched in CORS mode; a file:// document has origin
// `null`, so every import fails and the page renders blank with no explanation.
// No browser flag fixes this. Fail loudly with instructions instead.
if (location.protocol === 'file:') {
  document.documentElement.innerHTML =
    '<body style="font:16px/1.6 system-ui,sans-serif;padding:3rem;max-width:40rem;' +
    'margin:auto;background:#0b0d12;color:#e7ebf3">' +
    '<h1 style="color:#3ddc97">Run a local server</h1>' +
    '<p>ES modules cannot load from <code>file://</code>, so opening this file ' +
    'directly will never work.</p>' +
    '<pre style="background:#12151d;padding:1rem;border-radius:8px;border:1px solid #263041">' +
    'npm start</pre>' +
    '<p>then open <a href="http://localhost:8080" style="color:#5aa9ff">' +
    'http://localhost:8080</a>.</p></body>';
}
</script>
</head>
<body>
  <div id="game">
    <!-- The background canvas is the SAME picture underneath the live one, so
         it is hidden from the accessibility tree rather than announced as a
         second nameless canvas. `#board-fx` carries the name; see
         screens/battle-status.js `boardSummary`. -->
    <canvas id="board-bg" aria-hidden="true"></canvas>
    <canvas id="board-fx" role="img" aria-label="Battle map"></canvas>
    <div id="hud"></div>
    <div id="screen-root"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
  <script>
    // OFFLINE PLAY — see sw.js for why an idle game needs it and why the
    // worker caches at runtime rather than from a precache list.
    //
    // HTTPS ONLY, which also means "not the dev server", and that is the point
    // rather than a side effect. `npm start` serves plain http on localhost, so
    // a worker never installs during development or under tools/smoke.mjs and
    // tools/mobile.mjs — neither of which should be asserting against a cache
    // some earlier run happened to leave behind. Service workers are permitted
    // on localhost precisely so they CAN be tested there; opting out is a
    // deliberate trade of that for a dev loop and a CI run with no hidden state
    // in them.
    //
    // Registered after main.js and behind `load`, so it can never delay first
    // paint or contend with the module graph the game actually needs.
    if (location.protocol === 'https:' && 'serviceWorker' in navigator) {
      addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {
          // A refused registration is not worth a console error: the game works
          // perfectly without one, it simply will not open on a train.
        });
      });
    }
  </script>
</body>
</html>
